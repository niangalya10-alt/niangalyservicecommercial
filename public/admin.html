<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administration | NSC</title><link rel="stylesheet" href="/style.css"></head><body class="admin"><header><div class="nav"><a href="/" class="logo"><img src="/logo.svg" alt="Logo"></a><a class="btn line" href="/">← Site</a></div></header><main class="section"><div class="wrap"><div id="loginBox"><small>ESPACE PRIVÉ</small><h1>Administration</h1><form id="loginForm" class="formbox"><input id="username" value="admin" placeholder="Nom d'utilisateur"><input id="password" type="password" placeholder="Mot de passe"><button class="btn gold">Se connecter</button><p id="loginError"></p></form></div><div id="dashboard" hidden><div class="head"><div><small>TABLEAU DE BORD</small><h1>Gérer les véhicules & messages</h1></div><button id="logout" class="btn line">Déconnexion</button></div><div class="admin-grid"><section class="panel"><h2>Publier un véhicule</h2><form id="vehicleForm" class="formbox" enctype="multipart/form-data"><input name="title" required placeholder="Ex. Toyota RAV4 2021"><input name="price" required placeholder="Prix (FCFA)"><div class="two"><input name="year" placeholder="Année"><input name="mileage" placeholder="Kilométrage"></div><div class="two"><input name="fuel" placeholder="Carburant"><input name="gear" placeholder="Boîte de vitesses"></div><input name="image" type="file" accept="image/jpeg,image/png,image/webp"><textarea name="description" placeholder="Description"></textarea><button class="btn gold">Publier</button></form></section><section><h2>Annonces</h2><div id="adminVehicles"></div></section></div><h2 class="mt">Messages clients</h2><div id="messages"></div></div></div></main><script src="/admin.js"></script></body></html>
